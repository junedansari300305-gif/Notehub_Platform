<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notes & Videos | NoteHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #2196f3;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 2rem;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 40px 20px;
    }

    .title {
      font-size: 1.5rem;
      margin-bottom: 30px;
      font-weight: 600;
      text-align: center;
      color: #333;
    }

    .subject-card {
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      padding: 20px;
      margin-bottom: 30px;
    }

    .subject-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 10px;
      color: #222;
    }

    .notes-link {
      display: inline-block;
      margin-bottom: 12px;
      background-color: #e3f2fd;
      padding: 10px 14px;
      border-radius: 8px;
      color: #1976d2;
      text-decoration: none;
      font-weight: 500;
      transition: 0.3s;
    }

    .notes-link:hover {
      background-color: #bbdefb;

    iframe {
      width: 100%;
      height: 315px;
      border: none;
      border-radius: 10px;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #eee;
      color: #555;
      font-size: 0.9rem;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>NoteHub</header>

  <div class="container">
    <div class="title">📚 Notes & Videos for Semester X</div>

    <!-- Subject 1 -->
    <div class="subject-card">
      <div class="subject-title">1. Python Programming</div>
      <a href="https://example.com/notes/python_notes.pdf" class="notes-link" target="_blank">📄 View PDF Notes</a><br/>
      <iframe src="https://www.youtube.com/embed/rfscVS0vtbw" allowfullscreen></iframe>
    </div>

    <!-- Subject 2 -->
    <div class="subject-card">
      <div class="subject-title">2. Data Structures</div>
      <a href="https://example.com/notes/dsa.pdf" class="notes-link" target="_blank">📄 View PDF Notes</a><br/>
      <iframe src="https://www.youtube.com/embed/sVxBVvlnJsM" allowfullscreen></iframe>
    </div>

    <!-- Subject 3 -->
    <div class="subject-card">
      <div class="subject-title">3. DBMS</div>
      <a href="https://example.com/notes/dbms.pdf" class="notes-link" target="_blank">📄 View PDF Notes</a><br/>
      <iframe src="https://www.youtube.com/embed/TYo_CUnIWP8" allowfullscreen></iframe>
    </div>

    <!-- Add more subjects here as needed -->

  </div>

  <footer>© 2025 NoteHub | Built for Degree Students</footer>

</body>
</html>
