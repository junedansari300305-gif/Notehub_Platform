<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Select Your College | NoteHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f6f9;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #2196f3;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 2rem;
      font-weight: bold;
    }

    .container {
      padding: 40px 20px;
      max-width: 1100px;
      margin: auto;
    }

    .title {
      font-size: 1.5rem;
      margin-bottom: 30px;
      font-weight: 600;
      text-align: center;
      color: #333;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      font-weight: 600;
      font-size: 1.1rem;
      color: #333;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      transition: 0.3s;
    }

    .card:hover {
      background-color: #e3f2fd;
      transform: translateY(-3px);
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #eee;
      color: #555;
      font-size: 0.9rem;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>NoteHub</header>

  <div class="container">
    <div class="title">🎓 Select Your College</div>
    <div class="grid">
      <div class="card" onclick="goToCourses('Dr Babasaheb Ambedkar College')">Dr Babasaheb Ambedkar College, Chembur</div>
      <div class="card" onclick="goToCourses('KJ Somaiya College')">KJ Somaiya College</div>
      <div class="card" onclick="goToCourses('Ruia College')">Ruia College</div>
      <div class="card" onclick="goToCourses('Podar College')">Podar College</div>
      <div class="card" onclick="goToCourses('Wilson College')">Wilson College</div>
      <div class="card" onclick="goToCourses('St Xavier\'s College')">St. Xavier’s College</div>
      <div class="card" onclick="goToCourses('KC College')">KC College</div>
      <div class="card" onclick="goToCourses('HR College')">HR College</div>
      <div class="card" onclick="goToCourses('Mithibai College')">Mithibai College</div>
      <div class="card" onclick="goToCourses('Jai Hind College')">Jai Hind College</div>
    </div>
  </div>

  <footer>© 2025 NoteHub | Built for Degree Students</footer>

  <script>
    function goToCourses(collegeName) {
      // In real project, store this college info and go to next step
      alert("Selected College: " + collegeName);
      window.location.href = "select-course.html"; // next page (you'll build this next)
    }
  </script>

</body>
</html>
